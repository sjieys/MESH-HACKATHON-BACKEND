  # ── Search ────────────────────────────────
  /api/search:
    get:
      tags: [Search]
      summary: 검색 (S-01)
      parameters:
        - in: query
          name: keyword
          required: true
          schema: { type: string }
          example: 환경
        - in: query
          name: sidoCd
          schema: { type: integer }
          example: 6110000
        - in: query
          name: gugunCd
          schema: { type: integer }
          example: 3140000
        - in: query
          name: srvcClCode
          schema: { type: string }
          example: 환경ㆍ생태계보호
        - in: query
          name: progrmSttusSe
          schema: { type: integer }
          description: "2: 모집중만"
          example: 2
        - in: query
          name: pageNo
          schema: { type: integer, default: 1 }
        - in: query
          name: numOfRows
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerListResponse'

  /api/search/popular:
    get:
      tags: [Search]
      summary: 인기 검색어 (S-02)
      parameters:
        - in: query
          name: categoryCode
          schema: { type: string }
          description: 없으면 전체 탭
          example: ENV
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          type: integer
                          example: 1
                        keyword:
                          type: string
                          example: 환경
                        rankChange:
                          type: integer
                          example: 2
                        isNew:
                          type: boolean
                          example: false

  /api/search/history:
    get:
      tags: [Search]
      summary: 최근 검색어 (S-03)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 5
                        keyword:
                          type: string
                          example: 환경 봉사
                        searchedAt:
                          type: string
                          format: date-time
                          example: "2026-06-27T10:00:00"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Search]
      summary: 검색 기록 삭제 (S-04)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 검색 기록이 삭제되었습니다.
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ── Categories ────────────────────────────
  /api/categories:
    get:
      tags: [Categories]
      summary: 카테고리 목록 (C-01)
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          example: ENV
                        name:
                          type: string
                          example: 환경·생태
                        displayName:
                          type: string
                          example: 환경·생태
                        srvcClCode:
                          type: string
                          example: 환경ㆍ생태계보호

  # ── Regions ───────────────────────────────
  /api/regions:
    get:
      tags: [Regions]
      summary: 지역 목록 (R-01)
      parameters:
        - in: query
          name: sidoCd
          schema: { type: integer }
          description: 있으면 해당 시도의 구군 목록 반환, 없으면 시도 목록 반환
          example: 6110000
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: sidoCd 없을 때 - 시도 목록
                    properties:
                      sido:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: integer
                              example: 6110000
                            name:
                              type: string
                              example: 서울
                  - type: object
                    description: sidoCd 있을 때 - 구군 목록
                    properties:
                      gugun:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: integer
                              example: 3230000
                            name:
                              type: string
                              example: 강남구

  # ── Notifications ─────────────────────────
  /api/notifications:
    get:
      tags: [Notifications]
      summary: 알림 목록 (N-01)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        type:
                          type: string
                          enum: [deadline, activity_reminder, badge]
                          example: deadline
                        title:
                          type: string
                          example: 마감 임박 봉사
                        body:
                          type: string
                          example: "'한강 플로깅 캠페인' 모집이 내일 마감됩니다."
                        isRead:
                          type: boolean
                          example: false
                        createdAt:
                          type: string
                          format: date-time
                          example: "2026-06-27T09:00:00"
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

